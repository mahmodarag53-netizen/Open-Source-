name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # مزامنة أسبوعية لقائمة الفيديوهات من الدرايف
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync works.json from Drive
        run: python3 -I scripts/sync_drive.py || echo "sync failed, keeping committed works.json"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage site
        run: mkdir _site && cp index.html works.json robots.txt .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

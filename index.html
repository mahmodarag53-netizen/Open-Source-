<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0b0c'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%23e8b866'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0b0c; --ink:#f2efe9; --mute:#a19d94; --line:rgba(242,239,233,.14); --gold:#e8b866;
  --ease:cubic-bezier(.22,.8,.2,1);          /* دخول ناعم */
  --ease-io:cubic-bezier(.65,0,.35,1);       /* دخول/خروج */
  --pad:clamp(16px,4vw,56px);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;font-weight:400;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* موشن جرافيك خلف كل الصفحة */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;background:var(--bg)}
.page{position:relative;z-index:1}

/* header */
header{display:flex;justify-content:flex-start;align-items:center;gap:12px;flex-wrap:wrap;padding:18px var(--pad)}
.logo{font-size:1.2rem;font-weight:800}
.logo i{color:var(--gold);font-style:normal}
.social{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:5px 14px;font-size:.85rem;border:1px solid var(--line);border-radius:99px;background:#0b0b0c80;backdrop-filter:blur(8px);transition:border-color .5s var(--ease),color .5s var(--ease),transform .5s var(--ease),background .5s var(--ease)}
.pill:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
.pill.cv{background:var(--gold);border-color:var(--gold);color:#111;font-weight:600}
.pill.cv:hover{background:var(--ink);border-color:var(--ink);color:#111}

/* مقدمة: الاسم يُرسم على الكانفاس، والـ h1 للقراءة الآلية فقط */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.intro{min-height:74svh;display:flex;align-items:flex-start;justify-content:center;text-align:center;padding:0 var(--pad) clamp(32px,7vh,72px)}
.sub{opacity:0;transform:translateY(18px);transition:opacity 1.6s var(--ease),transform 1.6s var(--ease)}
.sub.on{opacity:1;transform:none}
.sub .role{font-size:clamp(1.3rem,3.2vw,2.2rem);color:var(--gold);font-weight:600;letter-spacing:.08em;line-height:1.4}
.sub .gal{font-size:clamp(.95rem,1.8vw,1.15rem);color:var(--mute);font-weight:300}
.sub .pill{display:inline-block;margin-top:14px;padding:8px 22px;font-size:.95rem}

/* filter */
.bar{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow-x:auto;padding:14px var(--pad);background:#0b0b0cd9;backdrop-filter:blur(14px);border-block:1px solid var(--line);scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 16px;border-radius:99px;color:var(--mute);font-size:.9rem;border:1px solid transparent;transition:color .5s var(--ease),background .5s var(--ease)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed=true]{color:#111;background:var(--ink)}
.chip small{opacity:.55;margin-inline-start:6px}

/* شبكة موحدة: كل الفيديوهات في إطار طولي 1080×1920 (9:16) بنفس المقاس */
main{padding:clamp(24px,5vw,64px) var(--pad) 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:clamp(14px,2vw,28px)}
.frame{position:relative;aspect-ratio:1080/1920;width:100%;background:#050506;display:block;text-align:start;
  outline:1px solid var(--line);outline-offset:6px;
  opacity:0;transform:translateY(34px);transition:opacity 1s var(--ease),transform 1s var(--ease),outline-color .8s var(--ease)}
.frame.in{opacity:1;transform:none}
.frame:hover{outline-color:#e8b86655}
/* زوايا الإطار */
.frame i{position:absolute;z-index:3;width:18px;height:18px;border:2px solid var(--gold);pointer-events:none;transition:width .7s var(--ease),height .7s var(--ease)}
.frame i:nth-child(1){top:-8px;right:-8px;border-left:0;border-bottom:0}
.frame i:nth-child(2){top:-8px;left:-8px;border-right:0;border-bottom:0}
.frame i:nth-child(3){bottom:-8px;right:-8px;border-left:0;border-top:0}
.frame i:nth-child(4){bottom:-8px;left:-8px;border-right:0;border-top:0}
.frame:hover i,.frame:focus-visible i{width:34px;height:34px}
.screen{position:absolute;inset:0;overflow:hidden}
.screen .bgimg{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:blur(22px) brightness(.55)}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:transform 1.4s var(--ease),filter 1s var(--ease);filter:saturate(.9) brightness(.88)}
.frame:hover img,.frame:focus-visible img{transform:scale(1.05);filter:saturate(1.08) brightness(1)}
.screen::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 62%,#0b0b0ce6)}
.meta{position:absolute;z-index:2;inset:auto 0 0 0;padding:12px 14px;display:flex;flex-direction:column-reverse;align-items:flex-start;gap:2px;font-size:.7rem}
.meta .cat{color:var(--gold);line-height:1.3}
.num{font-weight:600;color:var(--ink);direction:ltr;opacity:.85}
.play{position:absolute;z-index:2;top:50%;left:50%;width:54px;height:54px;margin:-27px;border-radius:50%;border:1px solid #fff9;display:grid;place-items:center;
  opacity:0;transform:scale(.6);transition:opacity .6s var(--ease),transform .8s var(--ease);backdrop-filter:blur(6px);background:#0b0b0c55}
.play svg{width:20px;fill:#fff;margin-inline-start:-3px}
.frame:hover .play,.frame:focus-visible .play{opacity:1;transform:none}
@media(hover:none){.play{opacity:.9;transform:none;width:48px;height:48px;margin:-24px}}

/* theater */
.theater{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:clamp(18px,3vw,40px);
  background:#050506e6;backdrop-filter:blur(18px);opacity:0;visibility:hidden;transition:opacity .6s var(--ease-io),visibility 0s .6s}
.theater.open{opacity:1;visibility:visible;transition:opacity .6s var(--ease-io)}
.stage{width:min(100%,calc((100svh - 150px)*1080/1920));transform:scale(.94) translateY(20px);transition:transform .9s var(--ease)}
.theater.open .stage{transform:none}
.theater .frame{opacity:1;transform:none;outline-color:#e8b86644;box-shadow:0 40px 120px #000}
.theater .frame:hover i{width:18px;height:18px}
.theater .screen::after{display:none}
.theater iframe{position:absolute;inset:0;z-index:1;width:100%;height:100%;border:0;background:#000}
.cap{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:16px}
.cap small{color:var(--gold);font-size:.9rem}
.cap>div:first-child{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.x{position:absolute;top:14px;inset-inline-start:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);font-size:1.2rem;transition:transform .6s var(--ease),border-color .6s var(--ease)}
.x:hover{transform:rotate(90deg);border-color:var(--gold)}
.nav{display:flex;gap:8px}
.nav button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);transition:border-color .5s var(--ease),transform .5s var(--ease)}
.nav button:hover{border-color:var(--gold);transform:scale(1.08)}

footer{padding:clamp(60px,12vw,140px) var(--pad) 48px;border-top:1px solid var(--line);text-align:center;background:#0b0b0cb3}
footer h2{font-size:clamp(1.8rem,6vw,4rem);line-height:1.3;font-weight:800}
footer h2 a{color:var(--gold);border-bottom:2px solid transparent;transition:border-color .6s var(--ease)}
footer h2 a:hover{border-color:var(--gold)}
footer .social{justify-content:center;margin-top:28px}
footer p{color:var(--mute);font-size:.8rem;margin-top:48px}
.empty{color:var(--mute);padding:60px 0;text-align:center}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .frame{opacity:1;transform:none}
}
</style>
</head>

<script>
(()=>{
const $=s=>document.querySelector(s);
const thumb=(id,w=800)=>`https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
const preview=id=>`https://drive.google.com/file/d/${id}/preview`;
const pad=n=>String(n).padStart(2,"0");
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

let works=[],view=[],cur=-1,lastFocus=null;

/* ---------- كشف بطيء: شظايا تتجمع لتكوّن الاسم ثم يتكشف، وتتحول لغبار خلف الصفحة ---------- */
(async()=>{
  const c=$("#fx"),x=c.getContext("2d"),NAME="Mahmoud Araj",GOLD="232,184,102",INK="242,239,233";
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;         // easeInOutCubic
  const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const R0=5.6,RD=2.8;                                       // بداية الكشف ومدته (ث)
  let W,H,D,fs,cx,cy,minX,maxX,pts=[],dust=[],shown=false;
  try{await Promise.race([document.fonts.load(`800 100px Cairo`,NAME),new Promise(r=>setTimeout(r,2500))])}catch(e){}
  const T0=performance.now();

  function layout(){
    D=Math.min(devicePixelRatio||1,1.5);W=c.width=Math.round(innerWidth*D);H=c.height=Math.round(innerHeight*D);
    fs=Math.min(W*.12,H*.27,210*D);cx=W/2;cy=H*.36;
    const o=document.createElement("canvas");o.width=W;o.height=Math.ceil(fs*1.7);
    const g=o.getContext("2d",{willReadFrequently:true});
    g.font=`800 ${fs}px Cairo, sans-serif`;g.direction="ltr";g.textAlign="center";g.textBaseline="middle";g.fillStyle="#fff";g.fillText(NAME,W/2,o.height/2);
    const d=g.getImageData(0,0,o.width,o.height).data;
    let step=Math.max(2,Math.round(fs/50)),all;
    for(;;){all=[];for(let yy=0;yy<o.height;yy+=step)for(let xx=0;xx<o.width;xx+=step)if(d[(yy*o.width+xx)*4+3]>128)all.push([xx,yy-o.height/2+cy]);
      if(all.length<=6000)break;step++}
    $("#sub").parentElement.style.paddingTop=Math.round((cy+fs*.6)/D)+"px";
    minX=Math.min(...all.map(p=>p[0]));maxX=Math.max(...all.map(p=>p[0]));
    const far=Math.max(W,H);
    pts=all.map(([tx,ty])=>{const a=rnd(0,6.283),r=rnd(.25,.85)*far;
      return{tx,ty,sx:cx+Math.cos(a)*r,sy:cy+Math.sin(a)*r*.7,dl:rnd(0,2.4)+(tx/W)*.8,du:rnd(2.6,3.8),ph:rnd(0,6.283),sz:rnd(1.1,2)*D}});
    dust=Array.from({length:Math.round(90*(W*H)/(1280*800))},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.6,1.6)*D,sp:rnd(.4,1),ph:rnd(0,6.283)}));
  }
  layout();addEventListener("resize",layout);

  const pos=(p,tt)=>{const e=ease(clamp((tt-p.dl)/p.du)),w=(1-e)*34*D;
    return[p.sx+(p.tx-p.sx)*e+Math.sin(p.ph+tt*1.7)*w,p.sy+(p.ty-p.sy)*e+Math.cos(p.ph+tt*1.3)*w]};
  function frame(now){
    const t=reduce?99:(now-T0)/1000,sy=scrollY*D,k=clamp(1-scrollY/(innerHeight*.55));
    x.globalAlpha=1;x.globalCompositeOperation="source-over";
    x.fillStyle="#0b0b0c";x.fillRect(0,0,W,H);
    x.globalCompositeOperation="lighter";
    // غبار الخلفية يظهر تدريجياً بعد الكشف
    const dk=ease(clamp((t-R0-1)/3));
    if(dk>0){x.fillStyle=`rgba(${GOLD},${.32*dk})`;
      for(const p of dust){const px=p.x+Math.sin(t*.12*p.sp+p.ph)*28*D,py=((p.y+Math.cos(t*.09*p.sp+p.ph)*22*D-sy*.18*p.sp)%H+H)%H;x.fillRect(px,py,p.r,p.r)}}
    if(k>0){
      x.save();x.translate(0,-sy*.45);
      // شظايا تتجمع
      const fade=1-ease(clamp((t-R0-.4)/(RD-.4)));
      if(fade>0){
        const done=[];x.strokeStyle=`rgba(${GOLD},${.85*k*fade})`;x.lineWidth=1.7*D;x.lineCap="round";x.beginPath();
        for(const p of pts){
          if((t-p.dl)/p.du>=1){done.push(p);continue}
          const a=pos(p,t-.06),b=pos(p,t);x.moveTo(a[0],a[1]);x.lineTo(b[0]+.01,b[1])}    // خط قصير على مسار الحركة = Motion Blur
        x.stroke();
        x.fillStyle=`rgba(${INK},${.9*k*fade})`;for(const p of done)x.fillRect(p.tx,p.ty,p.sz,p.sz);
      }
      // كشف الاسم من اليمين إلى اليسار
      const rp=clamp((t-R0)/RD);
      if(rp>0){
        const e=ease(rp),edge=minX-30*D+(maxX-minX+60*D)*e;
        x.globalCompositeOperation="source-over";x.save();x.beginPath();x.rect(0,0,edge,H);x.clip();
        x.font=`800 ${fs}px Cairo, sans-serif`;x.direction="ltr";x.textAlign="center";x.textBaseline="middle";
        x.fillStyle=`rgba(${INK},${k})`;x.fillText(NAME,cx,cy);x.restore();
        if(rp<1){const g=x.createLinearGradient(edge+60*D,0,edge-6*D,0);
          g.addColorStop(0,`rgba(${GOLD},0)`);g.addColorStop(1,`rgba(${GOLD},${.9*k})`);
          x.globalCompositeOperation="lighter";x.fillStyle=g;x.fillRect(edge-6*D,cy-fs*.7,66*D,fs*1.4)}
        // لمعة دورية بعد اكتمال الكشف
        else{const ph=((t-R0-RD)%12)/12;
          if(ph<.22){const s=ease(ph/.22),bx=minX-60*D+(maxX-minX+120*D)*s;
            x.globalCompositeOperation="source-over";x.save();x.beginPath();x.rect(bx-50*D,0,100*D,H);x.clip();
            x.font=`800 ${fs}px Cairo, sans-serif`;x.direction="ltr";x.textAlign="center";x.textBaseline="middle";
            x.fillStyle=`rgba(${GOLD},${.85*k})`;x.fillText(NAME,cx,cy);x.restore()}}
      }
      x.restore();
    }
    if(!shown&&t>=R0+1.8){shown=true;$("#sub").classList.add("on")}
    if(!reduce)requestAnimationFrame(frame);
  }
  if(reduce){frame(T0);addEventListener("resize",()=>frame(T0))}else requestAnimationFrame(frame);
  setTimeout(()=>$("#sub").classList.add("on"),12000);               // احتياط
})();

/* ---------- التصفية ---------- */
function buildBar(){
  const cats=[...new Set(works.map(w=>w.category))];
  const bar=$("#bar");
  const mk=(label,val,n)=>{
    const b=document.createElement("button");b.type="button";b.className="chip";
    b.setAttribute("aria-pressed",val==="");b.dataset.v=val;
    b.innerHTML=`${esc(label)}<small>${n}</small>`;return b;
  };
  bar.append(mk("الكل","",works.length),...cats.map(c=>mk(c,c,works.filter(w=>w.category===c).length)));
  bar.addEventListener("click",e=>{
    const b=e.target.closest(".chip");if(!b)return;
    bar.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));
    render(b.dataset.v);
  });
}

/* ---------- الشبكة ---------- */
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}
}),{rootMargin:"0px 0px -6% 0px"});

function render(cat){
  view=cat?works.filter(w=>w.category===cat):works;
  const g=$("#grid");g.textContent="";
  const frag=document.createDocumentFragment();
  view.forEach((w,i)=>{
    const b=document.createElement("button");
    b.type="button";b.className="frame";
    b.style.transitionDelay=`${(i%4)*70}ms`;
    b.setAttribute("aria-label",`تشغيل العمل ${pad(i+1)}`);
    const u=thumb(w.id,640);
    b.innerHTML=`<i></i><i></i><i></i><i></i>
      <span class="screen"><span class="bgimg" style="background-image:url(${u})"></span><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="${u}"></span>
      <span class="play"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></span>
      <span class="meta"><span class="cat">${esc(w.category)}</span><span class="num">${pad(i+1)}</span></span>`;
    b.addEventListener("click",()=>open(i));
    b.querySelector("img").addEventListener("error",e=>e.target.remove());
    frag.appendChild(b);
  });
  g.appendChild(frag);
  g.querySelectorAll(".frame").forEach(el=>io.observe(el));
}

/* ---------- المسرح ---------- */
const th=$("#theater"),screen=$("#screen");
function open(i){
  if(cur<0)lastFocus=document.activeElement;
  cur=(i+view.length)%view.length;const w=view[cur];
  screen.textContent="";
  const f=document.createElement("iframe");
  f.src=preview(w.id);f.allow="autoplay; fullscreen";f.allowFullscreen=true;f.title=`العمل ${pad(cur+1)}`;
  screen.appendChild(f);
  $("#drv").href=`https://drive.google.com/file/d/${w.id}/view`;
  $("#capCat").textContent=`${w.category} · ${pad(cur+1)} / ${pad(view.length)}`;
  th.classList.add("open");th.setAttribute("aria-hidden","false");document.body.classList.add("lock");
  $("#close").focus({preventScroll:true});
}
function close(){
  if(cur<0)return;cur=-1;
  screen.textContent="";                    // تفريغ الـ iframe فوراً لإيقاف الصوت
  th.classList.remove("open");th.setAttribute("aria-hidden","true");document.body.classList.remove("lock");
  lastFocus&&lastFocus.focus({preventScroll:true});
}
$("#close").onclick=close;
th.addEventListener("click",e=>{if(e.target===th)close()});
$("#next").onclick=()=>open(cur+1);
$("#prev").onclick=()=>open(cur-1);
addEventListener("keydown",e=>{
  if(cur<0)return;
  if(e.key==="Escape")close();
  else if(e.key==="ArrowLeft")open(cur+1);      // RTL: اليسار = التالي
  else if(e.key==="ArrowRight")open(cur-1);
});
addEventListener("pagehide",close);

/* ---------- تحميل ---------- */
fetch("works.json").then(r=>r.json()).then(d=>{
  works=d;if(!works.length)throw 0;
  buildBar();render("");
}).catch(()=>{$("#empty").hidden=false});
})();
</script>
</body>
</html>
